name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: Also run the live OpenRouter tests (uses the OPENROUTER_API_KEY secret; costs a fraction of a cent)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # AGP downloads the missing compile SDK itself once the licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      - name: Unit tests
        run: ./gradlew :core:testAndroidHostTest :core:desktopTest :app:testDebugUnitTest --console=plain
      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: umm-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  live:
    name: Live OpenRouter tests
    if: github.event_name == 'workflow_dispatch' && inputs.live
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      - name: Live tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: ./gradlew :core:testAndroidHostTest -Plive --tests '*LiveOpenRouterTest*' --console=plain
