name: Release

# Push a tag like v1.2.3 (or v1.2.3-beta.1 for a pre-release) to publish a signed APK as a GitHub Release.
# Run it manually to build a signed APK as a workflow artifact without publishing anything.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          core="${name%%-*}"
          IFS=. read -r major minor patch <<< "$core"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"
          [[ "$name" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"

  android:
    name: Android packages
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_CERT_SHA256: 58d78f15f0a79a572ada2537c8b5ce2242df36b0a553170eaa3a46eadfdb8104
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build signed release APK
        env:
          UMM_KEYSTORE_BASE64: ${{ secrets.UMM_KEYSTORE_BASE64 }}
          UMM_KEYSTORE_PASSWORD: ${{ secrets.UMM_KEYSTORE_PASSWORD }}
          UMM_KEY_ALIAS: ${{ secrets.UMM_KEY_ALIAS }}
          UMM_KEY_PASSWORD: ${{ secrets.UMM_KEY_PASSWORD }}
        run: |
          export UMM_KEYSTORE_FILE="$RUNNER_TEMP/umm-release.jks"
          echo "$UMM_KEYSTORE_BASE64" | base64 -d > "$UMM_KEYSTORE_FILE"
          ./gradlew assembleRelease bundleRelease --console=plain \
            -PversionName=${{ needs.version.outputs.name }} -PversionCode=${{ needs.version.outputs.code }}
          rm -f "$UMM_KEYSTORE_FILE"

      - name: Check the signature
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          apk=app/build/outputs/apk/release/app-release.apk
          actual="$("$apksigner" verify --print-certs "$apk" | awk '/certificate SHA-256 digest/ {print $NF; exit}')"
          if [[ "$actual" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::APK is signed with $actual, expected $EXPECTED_CERT_SHA256"
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/umm-${{ needs.version.outputs.name }}.apk"
          # The app bundle is for Google Play uploads; people install the APK.
          cp app/build/outputs/bundle/release/app-release.aab "dist/umm-${{ needs.version.outputs.name }}.aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-android
          path: dist/

  linux:
    name: Linux packages
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.openjdk21//25.08
          NFPM_VERSION="2.41.3"
          NFPM_SHA256="22aa6d3bc2ec239d62d3d190bcb036a47f2b24e0c3c6edfccebb6a55fbb2078e"
          curl -sLO "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" | sha256sum -c -
          sudo tar -C /usr/local/bin -xzf "nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" nfpm
          rm -f "nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          nfpm --version

      - name: Build Linux tarball, deb, and rpm
        run: |
          ./gradlew -PversionName=${{ needs.version.outputs.name }} \
            :desktop:packageLinuxTarball :desktop:packageLinuxDeb :desktop:packageLinuxRpm \
            --console=plain

      - name: Self-check packaged app image
        run: desktop/build/compose/binaries/main/app/Umm/bin/Umm --self-check

      - name: Build Flatpak bundle
        run: |
          sed -i 's/\${VERSION:-0.1.0}/${{ needs.version.outputs.name }}/' packaging/flatpak/io.github.agopalareddy.Umm.yml
          flatpak-builder --repo=repo --force-clean build-flatpak packaging/flatpak/io.github.agopalareddy.Umm.yml
          # --runtime-repo lets `flatpak install` fetch the runtime for people who have not set up Flathub.
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo io.github.agopalareddy.Umm.flatpak io.github.agopalareddy.Umm

      - name: Prepare Linux distribution artifacts
        run: |
          mkdir -p dist
          cp desktop/build/dist/umm-${{ needs.version.outputs.name }}-linux-x86_64.tar.gz dist/
          cp desktop/build/dist/umm_${{ needs.version.outputs.name }}_amd64.deb dist/
          cp desktop/build/dist/umm-${{ needs.version.outputs.name }}-1.x86_64.rpm dist/
          cp io.github.agopalareddy.Umm.flatpak dist/
          ls -la dist/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: dist/

  publish:
    name: Publish release
    needs: [version, android, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_CERT_SHA256: 58d78f15f0a79a572ada2537c8b5ce2242df36b0a553170eaa3a46eadfdb8104
    steps:
      - uses: actions/checkout@v7

      - name: Download Android artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist-android
          path: dist

      - name: Download Linux artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist-linux
          path: dist

      - name: Checksum release assets
        run: |
          cd dist
          # umm-* covers the APK, AAB, tarball and rpm; the deb is named umm_<version>_amd64.deb.
          sha256sum umm-* umm_* io.github.agopalareddy.Umm.flatpak > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: umm-${{ needs.version.outputs.name }}
          path: dist/

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          ### Android

          1. Download \`umm-${{ needs.version.outputs.name }}.apk\` below on your Android phone (Android 10 or newer).
          2. Open it and allow installs from your browser or files app when Android asks.
          3. Open Umm and follow the three setup steps.

          Updating: install the new APK over the old one. Your settings and history stay.

          Certificate SHA-256: \`$EXPECTED_CERT_SHA256\`

          ### Linux

          - **Tarball:** extract \`umm-${{ needs.version.outputs.name }}-linux-x86_64.tar.gz\` and run \`./install.sh\` (or \`sudo ./install.sh --system\`).
          - **Debian / Ubuntu:** \`sudo apt install ./umm_${{ needs.version.outputs.name }}_amd64.deb\` (or \`sudo dpkg -i\`).
          - **Fedora / RHEL:** \`sudo dnf install ./umm-${{ needs.version.outputs.name }}-1.x86_64.rpm\`.
          - **Flatpak:** \`flatpak install --user ./io.github.agopalareddy.Umm.flatpak\`.
          - **Arch Linux (AUR):** coming soon.
          NOTES
          flags=()
          [[ "${{ needs.version.outputs.prerelease }}" == "true" ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Umm ${{ needs.version.outputs.name }}" --notes-file notes.md --generate-notes "${flags[@]}"
